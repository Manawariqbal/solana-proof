name: SolanaProof CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd ${{ matrix.dir }}
          npm install

      - name: Run build/test
        run: |
          cd ${{ matrix.dir }}
          npm run build --if-present
          npm test --if-present
